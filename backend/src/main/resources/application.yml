spring:
  application:
    name: LinQOrbit

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linqorbit}
    username: ${DB_USERNAME:linqorbit}
    password: ${DB_PASSWORD:linqorbit}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    token-ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:linqorbit-local-dev-jwt-secret-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100}

server:
  port: 9080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{40} - %msg%n"
  level:
    com.linqorbit: INFO

