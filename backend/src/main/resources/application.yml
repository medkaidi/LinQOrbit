spring:
  application:
    name: LinQOrbit

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linqorbit}
    username: ${DB_USERNAME:linqorbit}
    password: ${DB_PASSWORD:linqorbit}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  auth:
    token-ttl-seconds: ${APP_JWT_TTL_SECONDS:86400}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:linqorbit-local-dev-jwt-secret-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:9082}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
  normalization:
    retry-delay-seconds: ${NORMALIZATION_RETRY_DELAY_SECONDS:60}
    threads: ${NORMALIZATION_THREADS:2}
  matching:
    retry-delay-seconds: ${MATCHING_RETRY_DELAY_SECONDS:60}
    threads: ${MATCHING_THREADS:2}
  embedding:
    # Couple actif (D55) : doit désigner le modèle réellement appelé par le
    # service IA (EMBEDDING_MODEL côté ai-service) — vérifié à chaque réponse.
    model-name: ${EMBEDDING_MODEL_NAME:gemini-embedding-2}
    model-version: ${EMBEDDING_MODEL_VERSION:1}
    threads: ${EMBEDDING_THREADS:1}
    retry-delay-seconds: ${EMBEDDING_RETRY_DELAY_SECONDS:60}
    quota-retry-delay-seconds: ${EMBEDDING_QUOTA_RETRY_DELAY_SECONDS:300}
    # Pause après chaque appel au fournisseur (quota du palier gratuit).
    min-interval-ms: ${EMBEDDING_MIN_INTERVAL_MS:1000}
    # Backfill des fiches déjà validées : explicite (jamais par défaut, un
    # démarrage de test ne doit pas appeler le fournisseur sur la base partagée).
    backfill-on-boot: ${EMBEDDING_BACKFILL_ON_BOOT:false}
    backfill-batch-size: ${EMBEDDING_BACKFILL_BATCH_SIZE:100}
  screening:
    # Taille du Top N (valeur expérimentale, SPEC §8.4.2) ; bornée par le service.
    top-n: ${SCREENING_TOP_N:10}
    # Recherche automatique à la publication (T-101) : un thread, retry one-shot après échec.
    threads: ${SCREENING_THREADS:1}
    retry-delay-seconds: ${SCREENING_RETRY_DELAY_SECONDS:30}
  attachments:
    storage-root: ${APP_ATTACHMENTS_ROOT:./data/attachments}
  admin:
    email: ${ADMIN_EMAIL:admin@linqorbit.local}
    password: ${ADMIN_PASSWORD:admin-local-dev}

server:
  port: 9080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{40} - %msg%n"
  level:
    com.linqorbit: INFO

