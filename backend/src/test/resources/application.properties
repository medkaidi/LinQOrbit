# Pool de connexions réduit pour les tests d'intégration.
# Chaque contexte Spring mis en cache pendant la JVM de test garde son pool Hikari
# (10 connexions par défaut) ; la base de dev partagée n'accepte que 100 connexions et la
# suite complète en saturait déjà ~99 : un contexte de plus faisait échouer le dernier
# démarré (« FATAL: sorry, too many clients already »). Les tests n'ouvrent que quelques
# connexions à la fois (les plus concurrents utilisent 2 threads).
# Ce fichier s'ajoute à src/main/resources/application.yml (extensions différentes).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# La reprise des jobs d'embedding au démarrage parcourt tous les jobs de la base : en test, la base de dev
# est partagée et un démarrage de contexte ne doit modifier aucune ligne réelle. Les ITs pilotent la reprise
# par l'entrée bornée à leur couple de test (EmbeddingWorker.recoverOrphanJobs(modèle, version, stratégie)).
app.embedding.recovery-on-boot=false
