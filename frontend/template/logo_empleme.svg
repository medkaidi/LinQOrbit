<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <!-- LinQOrbit - Refined Brand Logo with thinner orbits & mathematically harmonized optical kerning -->
  <!-- Background: Clean White -->
  <rect width="800" height="800" rx="32" fill="#FFFFFF"/>

  <!-- 1. UPPER EMBLEM SYSTEM -->
  <!-- Center at (400, 335) -->
  <g transform="translate(400, 455)">
    <!-- Background Slate Gray Orbit (-30 deg) - Lignes plus fines (stroke-width: 4.5px au lieu de 7.5px) -->
    <ellipse cx="0" cy="0" rx="112" ry="60" transform="rotate(-42)" 
             stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Foreground Dark Navy Orbit (+30 deg) - Lignes plus fines (stroke-width: 4.5px au lieu de 7.5px) -->
    <ellipse cx="0" cy="0" rx="112" ry="60" transform="rotate(42)" 
             stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Central nucleus circle: Vivid Orange (#F97316) - Ligne affinée harmonisée (stroke-width: 4.5px) -->
    <circle cx="0" cy="0" r="28" stroke="#F97316" stroke-width="4.5" fill="none"/>
  </g>

  <!-- 2. LOWER WORDMARK SYSTEM -->
  <!-- Center of the entire wordmark "LinQOrbit" at x: 400, y: 620 -->
  <!-- 
       Calcul de précision géométrique et crénage :
       - Q : centré à x = -24, rayon r = 26, stroke-width = 4.5px. Bord extérieur gauche du Q = -24 - 26 = -50px.
       - "Lin" : anchor="end" à x = -56px.
         Distance optique entre "Lin" et "Q" = (-50) - (-56) = 6px.
       
       - O : centré à x = 14, rayon r = 26, stroke-width = 4.5px. Bord extérieur droit du O = 14 + 26 = 40px.
       - "rbit" : pour avoir exactement la MÊME distance de 6px (décalage vers la gauche) :
         Position x = 40 + 6 = 46px.
         Décalé vers la gauche par rapport aux versions précédentes, assurant une parfaite équidistance Lin-Q et O-rbit.
  -->
  <g transform="translate(400, 620)">
    <!-- "Lin" in Dark Navy (#0F172A) -->
    <text x="-56" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="62" fill="#0F172A" letter-spacing="-0.03em">Lin</text>

    <!-- Q Emblem letter in Vivid Orange (#F97316) - trait fin & épuré (4.5px) -->
    <g transform="translate(-24, -20)">
      <!-- Q Circle body -->
      <circle cx="0" cy="0" r="26" stroke="#F97316" stroke-width="4.5" fill="none"/>
      <!-- Q dynamic sweeping orbital tail -->
      <path d="M 12 12 Q 22 24 32 30" stroke="#F97316" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- O Emblem letter in Dark Navy (#0F172A), overlapping Q - trait fin & épuré (4.5px) -->
    <g transform="translate(14, -20)">
      <circle cx="0" cy="0" r="26" stroke="#0F172A" stroke-width="4.5" fill="none"/>
    </g>

    <!-- "rbit" in Dark Navy (#0F172A) - décalé vers la gauche à x=46 pour égaliser strictement la distance avec le O -->
    <text x="43" y="0" text-anchor="start" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="62" fill="#0F172A" letter-spacing="-0.03em">rbit</text>

    <!-- Technical Sub-anchor / Brand Baseline -->
    <!--<text y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="0.32em">
      SHARED TRAJECTORY PLATFORM
    </text>-->

    <!-- Precision micro-dots for visual equilibrium 
    <circle cx="-165" cy="42" r="2.5" fill="#CBD5E1"/>
    <circle cx="165" cy="42" r="2.5" fill="#CBD5E1"/>-->
  </g>
</svg>