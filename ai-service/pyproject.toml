[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "langchain>=1.3.10",
    "langchain-google-genai>=3.1.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
